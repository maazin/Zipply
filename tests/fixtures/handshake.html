<!doctype html><html><head><title>Jobs | Handshake</title></head><body>
<!-- Modeled on app.joinhandshake.com/job-search: generated class names, a page-level h1, cards marked by data-hook, a right-hand pane that switches jobs without a page load, and a description clipped behind "... More". -->
<h1>Jobs</h1>
<div class="sc-list">
  <div data-hook="job-result-card | 111" data-is-active="true"><div><span>Globex</span><div>Data Analyst</div><div>$70-80/hr · Full-time</div></div></div>
  <div data-hook="job-result-card | 222" data-is-active="false"><div><span>Initech</span><div>Backend Engineer</div><div>$120K/yr · Full-time</div></div></div>
</div>
<div data-hook="right-content"></div>
<script>
  const jobs = {
    111: { company: 'Globex', title: 'Data Analyst', intro: 'Globex helps hospitals plan staffing, and we are growing fast.', desc: 'Turn scheduling data into decisions for operations leaders. You will build dashboards in Tableau on top of SQL, model in Excel, and automate weekly reporting in Python.', want: 'Curious, careful and kind. Medical coverage and paid time off.' },
    222: { company: 'Initech', title: 'Backend Engineer', intro: 'Initech moves money for small businesses across the country.', desc: 'Build and run the services behind our payments product. You will design APIs in Go and Java, run them on Kubernetes and AWS with PostgreSQL, and own their reliability end to end.', want: 'Owns outcomes. Equity package and 401(k) match.' },
    // One you applied to inside Handshake: no confirmation page, just "Applied on <date>".
    333: { company: 'Umbrella', title: 'ML Engineer', intro: 'Umbrella builds forecasting tools for clinics.', desc: 'Train and ship models in Python with PyTorch and scikit-learn, build data pipelines in SQL and Airflow, and deploy on AWS with Docker.', want: 'Curious and careful.', applied: true },
  }
  function show(id) {
    const j = jobs[id]
    const pane = document.querySelector('[data-hook="right-content"]')
    pane.innerHTML = `
      <div class="sc-a"><a href="/e/1"><img alt=""></a><a href="/e/1">${j.company}</a></div>
      <a href="/jobs/${id}"><h1 class="sc-hVXQrT">${j.title}</h1></a>
      ${j.applied ? `<div><h2>Applied on ${new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}</h2><button type="button">Withdraw application</button></div>` : ''}
      <div><h3>At a glance</h3><div>Full-time</div></div>
      <div><div><h3>Job description</h3></div><div class="sc-desc"><p>${j.intro}</p><span>...</span><button type="button" aria-label="Show more (${j.title})">More</button></div></div>
      <div><h3>What they're looking for</h3><p>${j.want}</p></div>
      <div><h3>About the employer</h3><p>${j.company} is a company.</p></div>`
    // Like Handshake: a few lines, then "... More" opens the rest.
    pane.querySelector('button[aria-label^="Show more"]').addEventListener('click', (e) => {
      const box = e.target.closest('.sc-desc')
      box.innerHTML = `<p>${j.intro}</p><p>${j.desc}</p><button type="button" aria-label="Show less (${j.title})">Less</button>`
    })
  }
  document.querySelectorAll('[data-hook^="job-result-card"]').forEach((card) =>
    card.addEventListener('click', () => {
      const id = card.getAttribute('data-hook').match(/\d+/)[0]
      history.pushState(null, '', `/job-search/${id}?page=1&per_page=25`)
      // The pane fills in a moment after the address changes, as on the real site.
      document.querySelector('[data-hook="right-content"]').innerHTML = ''
      setTimeout(() => show(id), 300)
    }),
  )
  show(location.pathname.match(/\d+/)?.[0] ?? 111)
</script>
</body></html>
